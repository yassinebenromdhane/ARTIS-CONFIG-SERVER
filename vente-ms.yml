spring:
  mvc:
    servlet:
      path: /vente
       
  datasource:
    url: jdbc:postgresql://192.168.123:6855/vente_ms
    username: postgres
    password: postgres

  jpa:
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://192.168.0.116:8180/realms/artis
      authorizationserver:
        endpoint:
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

jwt:
  auth:
    converter:
      resource-id: artis-rest-api
      principle-attribute: preferred_username

eureka:
  client:
    service-url:
      defaultZone: http://192.168.0.123:8761/eureka
      
server:
  port: 8095
